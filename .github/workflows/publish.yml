name: publish

on:
  workflow_run:
    workflows: ["test"]
    types: 
      - completed


jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      
      - name: Build
        run: |
          docker build .
