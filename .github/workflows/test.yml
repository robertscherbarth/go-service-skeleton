name: test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.21

    - name: Install dependencies
      run: go mod tidy

    - name: Build
      run: make build

    - name: Format
      run: make fmt

    - name: Vet
      run: make vet

    - name: Test
      run: make test
